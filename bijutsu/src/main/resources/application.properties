# MangaUpdates API Client Configuration
quarkus.openapi-generator.codegen.spec.mangaupdates_yaml.base-package=com.ameerdev.metadata_provider.mangaupdates.client
quarkus.openapi-generator.codegen.spec.mangaupdates_yaml.type-mappings.integer=java.lang.Long
quarkus.openapi-generator.codegen.spec.mangaupdates_yaml.type-mappings.number=java.lang.Long
quarkus.openapi-generator.codegen.spec.mangaupdates_yaml.additional-model-type-annotations=@io.quarkus.runtime.annotations.RegisterForReflection;@lombok.Builder(toBuilder = true)@SuppressWarnings({ \\"all\\", \\"unchecked\\", \\"rawtypes\\", \\"this-escape\\" })
quarkus.openapi-generator.codegen.input-base-dir=src/main/resources/openapi-definitions

quarkus.cache.caffeine."api-cache".expire-after-write=1H
quarkus.cache.caffeine."api-cache".maximum-size=5000

quarkus.http.root-path=/api

# =============================
# Database Configuration
quarkus.datasource.db-kind=postgresql

quarkus.datasource.jdbc.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/${DB_NAME:bijutsu}}
quarkus.datasource.username=${DATABASE_USER:postgres}
quarkus.datasource.password=${DATABASE_PASS:password}

quarkus.flyway.locations=db/migrations
quarkus.flyway.migrate-at-start=true
# ==============================

%dev.quarkus.datasource.dev-ui.allow-sql=true

# =============================
# CORS Configuration for WebUI
# =============================
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:5173,https://bijutsu.ameerdev.com
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.exposed-headers=Content-Disposition
quarkus.http.cors.access-control-max-age=24H
quarkus.http.cors.access-control-allow-credentials=true
